<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Care Radio Briefings Recorder</title>
<style>
:root{--bg:#f4f1ec;--panel:#fffdf9;--ink:#1d1b19;--mute:#6f6a63;--line:#ddd6cb;--acc:#d6362b;--acc2:#2b6cd6;--ok:#2e8b57;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141311;--panel:#1d1b19;--ink:#f1ede6;--mute:#9b948a;--line:#33302c;--acc:#ff5a4d;--acc2:#6aa0ff;--ok:#5fcf93}}
:root[data-theme="dark"]{--bg:#141311;--panel:#1d1b19;--ink:#f1ede6;--mute:#9b948a;--line:#33302c;--acc:#ff5a4d;--acc2:#6aa0ff;--ok:#5fcf93}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
body{padding:16px;min-height:100%}
.wrap{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}
.slot{max-width:1400px;margin:0 auto 28px}
.slot>h2{margin:0 0 10px;font-size:15px;color:var(--mute);letter-spacing:.08em;text-transform:uppercase}
nav{max-width:1400px;margin:0 auto 14px;display:flex;gap:8px;position:sticky;top:0;padding:8px 0;background:var(--bg);z-index:5}
nav{align-items:center;flex-wrap:wrap}
nav a{padding:6px 14px;border:1px solid var(--line);border-radius:999px;color:var(--ink);text-decoration:none;font-size:13px;font-weight:600;background:var(--panel)}
@media(max-width:820px){.wrap{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
h1{font-size:18px;margin:0 0 12px;letter-spacing:.02em}
label{font-size:12px;color:var(--mute);display:block;margin:10px 0 4px;text-transform:uppercase;letter-spacing:.06em}
input[type=text],select,textarea{width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font:inherit}
textarea{min-height:40vh;resize:vertical;line-height:1.6;font-size:18px;font-family:Georgia,"Times New Roman",serif}
.meta{display:flex;justify-content:space-between;color:var(--mute);font-size:13px;margin-top:8px;flex-wrap:wrap;gap:6px}
.btns{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:14px 0}
button{font:inherit;font-weight:600;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;display:flex;gap:8px;align-items:center;justify-content:center}
button:disabled{opacity:.4;cursor:not-allowed}
button:not(:disabled):hover{border-color:var(--mute)}
.rec{background:var(--acc);border-color:var(--acc);color:#fff}
.rec.on{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
.save{background:var(--acc2);border-color:var(--acc2);color:#fff;grid-column:1/-1}
.del.arm{background:var(--acc);color:#fff;border-color:var(--acc)}
.dot{width:10px;height:10px;border-radius:50%;background:currentColor;display:inline-block}
.sq{width:10px;height:10px;background:currentColor;display:inline-block}
.tri{width:0;height:0;border-left:10px solid currentColor;border-top:6px solid transparent;border-bottom:6px solid transparent}
.timer{font-variant-numeric:tabular-nums;font-size:34px;font-weight:700;text-align:center;margin:6px 0}
.meter{height:12px;border-radius:6px;background:var(--bg);border:1px solid var(--line);overflow:hidden}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ok),#e5b936 75%,var(--acc));transition:width .05s}
.status{font-size:13px;color:var(--mute);min-height:18px;margin-top:10px}
.status.err{color:var(--acc)}
audio{width:100%;margin-top:10px}
.wave{position:relative;height:90px;border:1px solid var(--line);border-radius:8px;background:var(--bg);margin:6px 0;overflow:hidden;cursor:pointer}
.wave canvas{width:100%;height:100%;display:block}
.wave .ph{position:absolute;top:0;bottom:0;width:2px;background:var(--acc);left:0;pointer-events:none;display:none}
.wave .empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:13px;pointer-events:none}
.globals{max-width:1400px;margin:0 auto 20px;display:grid;grid-template-columns:1fr 1.4fr 1.6fr;gap:12px}
@media(max-width:760px){.globals{grid-template-columns:1fr}}
.globals label{margin-top:0}
.fxc{max-width:1400px;margin:0 auto 20px}
.fxc summary{cursor:pointer;font-weight:700;font-size:15px}
.fxg{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:4px 18px;margin-top:10px}
.fxg label{display:flex;justify-content:space-between;margin:8px 0 2px;text-transform:none;letter-spacing:0;font-size:13px}
.fxg label b{color:var(--ink);font-weight:600}
.fxg input[type=range]{width:100%}
.fxg .chk{flex-direction:row;justify-content:flex-start;gap:8px;align-items:center;color:var(--ink);font-weight:600;grid-column:1/-1;margin-top:14px}
.sm{padding:8px 12px;font-size:13px}
.acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.trim{display:grid;grid-template-columns:1fr 1fr;gap:8px;grid-column:1/-1;align-items:end}
.trim label{margin:0 0 4px}
.trim>div{grid-column:1/-1;display:flex;gap:8px;align-items:center}
.trim input[type=number]{width:90px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font:inherit}
.row{display:flex;gap:8px}.row>*{flex:1}
small{color:var(--mute)}
.recc{display:grid;grid-template-columns:1.7fr 1fr;gap:14px;max-width:1400px;margin:0 auto 14px}
@media(max-width:860px){.recc{grid-template-columns:1fr}}
.recc .card{padding:12px 14px}
.tr{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tr button{flex:1;min-width:90px}
.tr input[type=number]{width:80px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font:inherit}
.estbox{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;text-align:center}
.recc .timer{font-size:24px;margin:8px 0 2px}
.stories{max-width:1400px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.sc{padding:12px}
.sh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.sh b{font-size:16px}
.dur{font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}
.sp{flex:1}
.sh .sm{padding:5px 9px;font-size:12px}
.sc textarea{height:auto;min-height:56px;overflow:hidden;resize:none;font-size:17px;line-height:1.5}
.wave{height:70px}
.mount{max-width:1400px;margin:0 auto 12px}
.mount:empty{margin:0}
#outroMount{margin:12px auto 0}
.sc.slim textarea{min-height:40px}
.sc.slim{padding:10px 12px}
</style>
</head>
<body>
<h1 style="max-width:1400px;margin:0 auto 6px;font-size:22px">Care Radio Briefings Recorder</h1>
<nav><button id="pdfAll" class="sm" style="margin-left:0">⬇ Export scripts (PDF)</button><button id="clearAll" class="sm">✕ Clear all</button><span id="navMsg" style="align-self:center;font-size:13px;color:var(--mute)"></span></nav>
<div class="card globals">
  <div><label for="txDate">TX Date</label><input type="date" id="txDate"></div>
  <div><label for="newsreader">Newsreader</label><input type="text" id="newsreader" placeholder="e.g. Jane Smith"></div>
  <div><label for="gDev">Audio input</label><div class="row"><select id="gDev"><option value="">Default input</option></select><button id="gRefresh" style="flex:0 0 auto;padding:9px 12px" title="Allow microphone / refresh inputs">↻</button></div></div>
</div>
<details class="card fxc">
  <summary>Voice processing <small>(applied by “Trim and Process”)</small></summary>
  <label for="fxPreset" style="margin-top:12px">Preset</label>
  <select id="fxPreset" style="max-width:340px">
    <option value="clean">Clean voice – gentle EQ + light compression</option>
    <option value="radio">Radio punch – brighter EQ + firmer compression</option>
    <option value="off">Off – trim and loudness only</option>
    <option value="custom">Custom</option>
  </select>
  <div class="fxg" id="fxg"></div>
  <small style="display:block;margin-top:10px">Chain order: trim → noise gate → EQ → compressor → loudness to -12 LUFS → peak limiter (-1 dBFS).</small>
</details>

<section class="recc">
  <div class="card">
    <h1>Recorder</h1>
    <div class="tr">
      <button class="rec" id="r_rec"><span class="dot"></span>Record</button>
      <button id="r_stop" disabled><span class="sq"></span>Stop</button>
      <button id="r_play" disabled><span class="tri"></span>Replay</button>
      <button class="del" id="r_del" disabled>🗑 Delete</button>
    </div>
    <div class="meter" style="margin-top:10px"><i id="r_lvl"></i></div>
    <div class="wave" id="r_wave"><canvas id="r_cv"></canvas><div class="ph" id="r_ph"></div><div class="empty" id="r_wempty">Waveform appears after recording</div></div>
    <div class="tr">
      <span style="font-size:13px;color:var(--mute)">Silence threshold</span><input type="number" id="r_thr" value="-40" min="-90" max="-10" step="1"><span style="font-size:13px;color:var(--mute)">dB</span>
      <button id="r_trim" disabled>✂ Trim and Process</button>
      <button id="r_undo" disabled>↶ Undo processing</button>
    </div>
    <audio id="r_player" controls hidden></audio>
  </div>
  <div class="card">
    <label style="margin-top:0">Estimate total duration</label>
    <div class="estbox" id="r_est">0:00</div>
    <div class="timer" id="r_time">0:00.0</div>
    <small id="r_actual" style="display:block;text-align:center;min-height:16px"></small>
    <label for="r_fname">Export file name <small>(optional override)</small></label>
    <input type="text" id="r_fname">
    <button class="save" id="r_save" disabled style="width:100%;margin-top:10px">⬇ Save MP3</button>
    <div class="status" id="r_status"></div>
  </div>
</section>

<div class="mount" id="introMount"></div>
<div class="stories" id="stories"></div>
<div class="mount" id="finallyMount" style="margin-top:12px"></div>
<div class="stories" id="stories2"></div>
<div class="mount" id="outroMount"></div>

<template id="stpl">
<section class="card sc">
  <div class="sh"><b data-k="h">Story</b><span class="dur" data-k="dur">0:00 · 0 words</span><span class="sp"></span>
    <button data-k="paste" class="sm">⎘ Paste all</button><button data-k="copy" class="sm">⧉ Copy</button><button data-k="clear" class="sm">✕ Clear</button></div>
  <textarea data-k="script" placeholder="Type or paste this story here…"></textarea>
</section>
</template>

<script src="https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.1/lame.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const slots=[];
const fmtT=s=>{const m=Math.floor(s/60);return m+':'+(s%60).toFixed(1).padStart(4,'0')};
const clean=n=>n.replace(/[\\/:*?"<>|]+/g,'_').trim();
let activeRec=null;

/* ---- Global TX Date / Newsreader ---- */
const gDate=document.getElementById('txDate'),gReader=document.getElementById('newsreader');
try{const g=JSON.parse(localStorage.getItem('crs-global')||'null');if(g){gDate.value=g.date||'';gReader.value=g.reader||''}}catch(e){}
if(!gDate.value){const d=new Date();gDate.value=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
const txDate=long=>{const v=gDate.value;if(!/^\d{4}-\d{2}-\d{2}$/.test(v))return '';return v.slice(8,10)+v.slice(5,7)+(long?v.slice(0,4):v.slice(2,4))};
const reader=()=>clean(gReader.value);
const nr=()=>gReader.value.trim()||'[Newsreader]';
const introText=()=>"Hello I\u2019m "+nr()+" with some more care news from around the UK.";
const outroText=()=>"That\u2019s it from me "+nr()+" there\u2019ll be more in an hour.";
const finallyText=()=>"And finally,";
const OLD_DEFAULTS=[/^We are Care Radio, I'm .*\.$/,/^For more Care news every day, stay with Care Radio\.$/];
const niceDate=()=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(gDate.value);if(!m)return '';const d=new Date(+m[1],+m[2]-1,+m[3]);if(isNaN(d))return '';const n=d.getDate(),suf=(n%100>=11&&n%100<=13)?'th':({1:'st',2:'nd',3:'rd'}[n%10]||'th');return d.toLocaleDateString('en-GB',{weekday:'long'})+' '+n+suf+' '+d.toLocaleDateString('en-GB',{month:'long'})};
const audioBase=()=>[niceDate(),reader()].filter(Boolean).join(' ')||'Care Radio briefing';
const pdfBase=()=>[niceDate(),reader()].filter(Boolean).join(' ');
function globalsChanged(){try{localStorage.setItem('crs-global',JSON.stringify({date:gDate.value,reader:gReader.value}))}catch(e){}slots.forEach(s=>s.refresh());refreshName()}
gDate.addEventListener('input',globalsChanged);gReader.addEventListener('input',globalsChanged);

/* ---- Voice processing (EQ, compressor, gate) ---- */
const FX_SPECS=[['hpf','High-pass filter',0,200,5,' Hz'],['low','Low shelf (120 Hz)',-12,12,.5,' dB'],['pres','Presence (3.5 kHz)',-12,12,.5,' dB'],['air','Air (10 kHz)',-12,12,.5,' dB'],
  ['thr','Compressor threshold',-60,-6,1,' dB'],['ratio','Compressor ratio',1,10,.5,':1'],['att','Compressor attack',1,50,1,' ms'],['rel','Compressor release',20,500,10,' ms'],['gthr','Gate threshold',-80,-30,1,' dB']];
const FX_PRESETS={
  off:  {hpf:0,low:0,pres:0,air:0,comp:false,thr:-24,ratio:3,att:10,rel:150,gate:false,gthr:-55},
  clean:{hpf:80,low:0,pres:3,air:2,comp:true,thr:-24,ratio:3,att:10,rel:150,gate:false,gthr:-55},
  radio:{hpf:90,low:2,pres:4,air:3,comp:true,thr:-28,ratio:4,att:5,rel:120,gate:false,gthr:-55}
};
const fxEl={},fxPreset=document.getElementById('fxPreset');
(function(){
  const g=document.getElementById('fxg');
  const chk=(k,t)=>{const l=document.createElement('label');l.className='chk';l.innerHTML='<input type="checkbox" id="fx_'+k+'"> '+t;g.appendChild(l);fxEl[k]=l.firstElementChild};
  const rng=sp=>{const [k,t,mn,mx,st,u]=sp,w=document.createElement('div');
    w.innerHTML='<label for="fx_'+k+'">'+t+'<b id="fxv_'+k+'"></b></label><input type="range" id="fx_'+k+'" min="'+mn+'" max="'+mx+'" step="'+st+'">';g.appendChild(w);fxEl[k]=w.querySelector('input')};
  const by=Object.fromEntries(FX_SPECS.map(x=>[x[0],x]));
  ['hpf','low','pres','air'].forEach(k=>rng(by[k]));
  chk('comp','Compressor');['thr','ratio','att','rel'].forEach(k=>rng(by[k]));
  chk('gate','Noise gate');rng(by.gthr);
})();
function fxShow(){FX_SPECS.forEach(([k,,,,,u])=>{const v=+fxEl[k].value;document.getElementById('fxv_'+k).textContent=(k==='hpf'&&!v?'off':((v>0&&u===' dB'&&k!=='thr'&&k!=='gthr'?'+':'')+v+u))})}
function fxSet(o){Object.keys(o).forEach(k=>{if(!fxEl[k])return;if(fxEl[k].type==='checkbox')fxEl[k].checked=!!o[k];else fxEl[k].value=o[k]});fxShow()}
function getFx(){const o={};Object.keys(FX_PRESETS.off).forEach(k=>o[k]=fxEl[k].type==='checkbox'?fxEl[k].checked:+fxEl[k].value);return o}
function fxSave(){try{localStorage.setItem('crs-fx',JSON.stringify({preset:fxPreset.value,fx:getFx()}))}catch(e){}}
try{const f=JSON.parse(localStorage.getItem('crs-fx')||'null');if(f){fxPreset.value=f.preset;fxSet(f.fx)}else fxSet(FX_PRESETS.clean)}catch(e){fxSet(FX_PRESETS.clean)}
fxPreset.onchange=()=>{if(FX_PRESETS[fxPreset.value])fxSet(FX_PRESETS[fxPreset.value]);fxSave()};
Object.values(fxEl).forEach(e=>e.addEventListener('input',()=>{fxPreset.value='custom';fxShow();fxSave()}));

function gateFx(l,r,sr,thDb){
  const th=Math.pow(10,thDb/20),floor=Math.pow(10,-15/20),ga=1-Math.exp(-1/(.003*sr)),gr=1-Math.exp(-1/(.15*sr)),ed=1-Math.exp(-1/(.06*sr));
  let env=0,g=1;
  for(let i=0;i<l.length;i++){const p=Math.max(Math.abs(l[i]),Math.abs(r[i]));env=p>env?p:env-env*ed;const t=env>th?1:floor;g+=(t-g)*(t>g?ga:gr);l[i]*=g;r[i]*=g}
}
async function applyFx(l,r,sr,fx){
  const parts=[];
  if(fx.gate){gateFx(l,r,sr,fx.gthr);parts.push('gate')}
  const eq=fx.hpf>0||fx.low||fx.pres||fx.air;
  if(!eq&&!fx.comp)return {l,r,desc:parts.length?' ('+parts.join(', ')+')':''};
  const n=l.length,oc=new OfflineAudioContext(2,n,sr),buf=oc.createBuffer(2,n,sr);
  buf.copyToChannel(l,0);buf.copyToChannel(r,1);
  const src=oc.createBufferSource();src.buffer=buf;let node=src;
  const add=nd=>{node.connect(nd);node=nd};
  const bq=(type,f,gain,q)=>{const b=oc.createBiquadFilter();b.type=type;b.frequency.value=f;if(gain!==undefined)b.gain.value=gain;b.Q.value=q||.707;add(b)};
  if(fx.hpf>0)bq('highpass',fx.hpf,undefined,.707);
  if(fx.low)bq('lowshelf',120,fx.low);
  if(fx.pres)bq('peaking',3500,fx.pres,.9);
  if(fx.air)bq('highshelf',10000,fx.air);
  if(eq)parts.push('EQ');
  if(fx.comp){const c=oc.createDynamicsCompressor();c.threshold.value=fx.thr;c.knee.value=6;c.ratio.value=fx.ratio;c.attack.value=fx.att/1000;c.release.value=fx.rel/1000;add(c);parts.push('compression')}
  node.connect(oc.destination);src.start();
  const out=await oc.startRendering();
  return {l:out.getChannelData(0).slice(),r:out.getChannelData(1).slice(),desc:' ('+parts.join(', ')+')'};
}

/* ---- Loudness (ITU-R BS.1770-4 / EBU R128 integrated LUFS) ---- */
function subEnergy(x,sr,sub){
  const f1=1681.974450955533,G=3.999843853973347,Q1=0.7071752369554196,K1=Math.tan(Math.PI*f1/sr),Vh=Math.pow(10,G/20),Vb=Math.pow(Vh,0.4996667741545416),A0=1+K1/Q1+K1*K1;
  const c=[(Vh+Vb*K1/Q1+K1*K1)/A0,2*(K1*K1-Vh)/A0,(Vh-Vb*K1/Q1+K1*K1)/A0,2*(K1*K1-1)/A0,(1-K1/Q1+K1*K1)/A0];
  const Q2=0.5003270373238773,K2=Math.tan(Math.PI*38.13547087602444/sr),B0=1+K2/Q2+K2*K2,d1=2*(K2*K2-1)/B0,d2=(1-K2/Q2+K2*K2)/B0;
  const nb=Math.floor(x.length/sub),E=new Float64Array(nb),end=nb*sub;
  let x1=0,x2=0,y1=0,y2=0,u1=0,u2=0,w1=0,w2=0;
  for(let i=0;i<end;i++){
    const v=x[i],y=c[0]*v+c[1]*x1+c[2]*x2-c[3]*y1-c[4]*y2;x2=x1;x1=v;y2=y1;y1=y;
    const w=y-2*u1+u2-d1*w1-d2*w2;u2=u1;u1=y;w2=w1;w1=w;
    E[(i/sub)|0]+=w*w;
  }
  return E;
}
function lufs(l,r,sr){
  const sub=Math.round(sr*.1),El=subEnergy(l,sr,sub),Er=subEnergy(r,sr,sub),nb=El.length;
  if(nb<4)return null;
  const lu=z=>-0.691+10*Math.log10(z),blocks=[];
  for(let j=0;j+4<=nb;j++){let z=0;for(let k=0;k<4;k++)z+=El[j+k]+Er[j+k];blocks.push(z/(4*sub))}
  const a=blocks.filter(z=>lu(z)>-70);if(!a.length)return null;
  const mean=q=>q.reduce((p,c)=>p+c,0)/q.length,t=lu(mean(a))-10,b=a.filter(z=>lu(z)>t);
  return b.length?lu(mean(b)):null;
}
function limiter(l,r,sr,ceil){
  const n=l.length,g=new Float32Array(n);let hit=false;
  for(let i=0;i<n;i++){const p=Math.max(Math.abs(l[i]),Math.abs(r[i]));if(p>ceil){g[i]=ceil/p;hit=true}else g[i]=1}
  if(!hit)return false;
  const N=Math.max(2,Math.round(sr*.008)),m=new Float32Array(n),dq=new Int32Array(n);let h=0,t=0;
  for(let j=n-1;j>=0;j--){while(t>h&&g[dq[t-1]]>=g[j])t--;dq[t++]=j;while(dq[h]>j+N-1)h++;m[j]=g[dq[h]]}
  const get=j=>m[j<0?0:j],al=1-Math.exp(-1/(.15*sr));
  let sum=0,prev=1;for(let j=-N+1;j<=0;j++)sum+=get(j);
  for(let i=0;i<n;i++){
    if(i>0)sum+=m[i]-get(i-N);
    const o=Math.min(sum/N,prev+(1-prev)*al);l[i]*=o;r[i]*=o;prev=o;
  }
  return true;
}

/* ---- Shared encoding ---- */
const to16=f=>{const o=new Int16Array(f.length);for(let i=0;i<f.length;i++){const s=Math.max(-1,Math.min(1,f[i]));o[i]=s<0?s*0x8000:s*0x7fff}return o};
function wavBlob(t){
  const l=to16(t.l),r=to16(t.r),n=l.length,buf=new ArrayBuffer(44+n*4),v=new DataView(buf);
  const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
  w(0,'RIFF');v.setUint32(4,36+n*4,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,2,true);
  v.setUint32(24,t.sr,true);v.setUint32(28,t.sr*4,true);v.setUint16(32,4,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*4,true);
  let p=44;for(let i=0;i<n;i++){v.setInt16(p,l[i],true);v.setInt16(p+2,r[i],true);p+=4}
  return new Blob([buf],{type:'audio/wav'});
}
function mp3Blob(t){
  if(typeof lamejs==='undefined')throw new Error('MP3 encoder failed to load (needs internet access). WAV still works.');
  const enc=new lamejs.Mp3Encoder(2,t.sr,192),l=to16(t.l),r=to16(t.r),out=[];
  for(let i=0;i<l.length;i+=1152){const b=enc.encodeBuffer(l.subarray(i,i+1152),r.subarray(i,i+1152));if(b.length)out.push(new Uint8Array(b))}
  const e=enc.flush();if(e.length)out.push(new Uint8Array(e));
  return new Blob(out,{type:'audio/mpeg'});
}
function merge(a){let n=0;a.forEach(c=>n+=c.length);const o=new Float32Array(n);let p=0;a.forEach(c=>{o.set(c,p);p+=c.length});return o}

/* ---- Audio input (one selector for all stories) ---- */
const gDev=document.getElementById('gDev');
async function listDevices(){
  try{
    const ds=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='audioinput'),cur=gDev.value;
    gDev.innerHTML='<option value="">Default input</option>';
    ds.forEach((d,i)=>{if(d.deviceId==='default')return;const o=document.createElement('option');o.value=d.deviceId;o.textContent=d.label||('Input '+(i+1));gDev.appendChild(o)});
    if([...gDev.options].some(o=>o.value===cur))gDev.value=cur;
  }catch(e){}
}
document.getElementById('gRefresh').onclick=async()=>{
  const msg=document.getElementById('navMsg'),say=(m,e)=>{msg.textContent=m;msg.style.color=e?'var(--acc)':''};
  try{const st=await navigator.mediaDevices.getUserMedia({audio:true});st.getTracks().forEach(t=>t.stop());await listDevices();say('Microphone ready.')}
  catch(e){say('Microphone unavailable: '+(e.message||e.name)+'. If viewing in a preview pane, download the file and open it in your browser.',true)}
};


/* ---- Helpers ---- */
const mmss=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
const gsay=(m,err)=>{const e=document.getElementById('navMsg');e.textContent=m;e.style.color=err?'var(--acc)':''};
function updateTotal(){document.getElementById('r_est').textContent=mmss(slots.reduce((a,s)=>a+s.secs(),0))}

/* ---- Story boxes ---- */
function makeStory(idx,label,mount,def){
  const root=document.getElementById('stpl').content.firstElementChild.cloneNode(true);
  mount.appendChild(root);if(def)root.classList.add('slim');
  const q=k=>root.querySelector('[data-k="'+k+'"]'),ta=q('script'),key='crs-draft-'+idx;
  q('h').textContent=label;
  let st=0,clrT=0,pstT=0,tplT=0,had=false;
  const words=()=>(ta.value.trim().match(/\S+/g)||[]).length,secs=()=>Math.round(words()/150*60);
  function fit(){ta.style.height='auto';ta.style.height=(ta.scrollHeight+2)+'px'}
  function stats(){fit();const w=words();q('dur').textContent=mmss(secs())+' · '+w+' word'+(w===1?'':'s');updateTotal()}
  function persist(){stats();clearTimeout(st);st=setTimeout(()=>{try{localStorage.setItem(key,JSON.stringify({script:ta.value}))}catch(e){}},400)}
  try{const d=JSON.parse(localStorage.getItem(key)||'null');if(d){had=true;ta.value=d.script||''}if(def&&had&&OLD_DEFAULTS.some(r=>r.test(ta.value.trim()))){ta.value=def();persist()}}catch(e){}
  let lastDefault=null;
  if(def){if(!had)ta.value=def();lastDefault=ta.value===def()?ta.value:null}
  else if(/^We are Care Radio, I'm[\s\S]*?with news that,\s*For more care news, stay with us here on Care Radio\.$/.test(ta.value.trim()))ta.value='';
  ta.addEventListener('input',persist);

  const arm=(btn,label,armLabel,ms)=>{let t=0;return {reset(){clearTimeout(t);btn.dataset.arm='';btn.style.background='';btn.style.color='';btn.textContent=label},
    set(){btn.dataset.arm='1';btn.style.background='var(--acc)';btn.style.color='#fff';btn.textContent=armLabel;t=setTimeout(()=>this.reset(),ms)}}};
  const pst=q('paste'),pa=arm(pst,'⎘ Paste all','Overwrite? Click again',4000);
  pst.onclick=async()=>{
    if(ta.value.trim()&&!pst.dataset.arm){pa.set();gsay('Warning: pasting will replace everything in '+label+'.',true);return}
    pa.reset();let t;
    try{t=await navigator.clipboard.readText()}catch(e){ta.focus();ta.select();gsay('Your browser blocked direct clipboard access. '+label+' is selected – press Ctrl/Cmd+V to paste over it (plain text only).',true);return}
    t=(t||'').replace(/\r\n?/g,'\n').replace(/[\u200b\u200c\u200d\ufeff]/g,'').replace(/\u00a0/g,' ').trim();
    if(!t){gsay('The clipboard has no text to paste.',true);return}
    ta.value=t;persist();gsay('Pasted '+words()+' words into '+label+' as plain text.');
  };
  q('copy').onclick=async()=>{
    const txt=label+'\n\n'+ta.value.trim()+'\n\nEstimated read time: '+mmss(secs())+' ('+words()+' words at 150 wpm)';
    try{await navigator.clipboard.writeText(txt)}catch(e){
      const t=document.createElement('textarea');t.value=txt;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();
      let ok=false;try{ok=document.execCommand('copy')}catch(_){}t.remove();if(!ok){gsay('Copy failed – select the text and copy manually.',true);return}
    }
    gsay('Copied '+label+' and its read time to the clipboard.');
  };
  const clr=q('clear'),ca=arm(clr,'✕ Clear','Confirm clear?',3000);
  clr.onclick=()=>{if(!clr.dataset.arm){ca.set();return}ca.reset();ta.value='';persist();gsay(''+label+' cleared.')};

  const api={idx,label,fit,clearable:!def,secs,text:()=>ta.value.trim(),
    clearText(){ta.value='';persist()},
    refresh(){if(def&&lastDefault!==null&&ta.value===lastDefault){const nd=def();if(nd!==lastDefault){ta.value=nd;lastDefault=nd;persist()}}stats()}};
  stats();return api;
}
slots.push(makeStory('intro','Intro',document.getElementById('introMount'),introText));
for(let i=1;i<=3;i++)slots.push(makeStory(i,'Story '+i,document.getElementById('stories'),null));
slots.push(makeStory('finally','And finally',document.getElementById('finallyMount'),finallyText));
slots.push(makeStory(4,'Story 4',document.getElementById('stories2'),null));
slots.push(makeStory('outro','Outro',document.getElementById('outroMount'),outroText));
updateTotal();
const fitAll=()=>slots.forEach(s=>s.fit());
addEventListener('resize',fitAll);addEventListener('load',fitAll);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fitAll);
requestAnimationFrame(fitAll);

/* ---- Single recorder ---- */
const el={};['rec','stop','play','del','save','trim','undo','thr','fname','cv','ph','wempty','lvl','time','status','player','wave','actual'].forEach(k=>el[k]=document.getElementById('r_'+k));
let orig=null,CL=[],CR=[],sampleRate=48000,ctx,stream,proc,analyser,recording=false,take=null,takeUrl=null,t0=0,raf=0,delT=0,phRaf=0;
const say=(m,err)=>{el.status.textContent=m;el.status.className='status'+(err?' err':'')};
const exportBase=()=>clean((el.fname.value.trim()||audioBase()).replace(/\.(wav|mp3)$/i,''))||'Care Radio briefing';
function refreshName(){el.fname.placeholder=audioBase()+'.mp3 (default)'}
refreshName();

function ui(){
  const playing=take&&!el.player.paused&&!el.player.ended;
  el.rec.disabled=recording;el.rec.classList.toggle('on',recording);
  el.stop.disabled=!(recording||playing);
  el.play.disabled=recording||!take;el.del.disabled=recording||!take;el.save.disabled=recording||!take;
  el.trim.disabled=recording||!take;el.undo.disabled=recording||!orig;
  el.wempty.style.display=take?'none':'flex';el.player.hidden=!take;
  el.actual.textContent=take?'Recorded length '+fmtT(take.l.length/take.sr):'';
}
function drawWave(){
  const c=el.cv,dpr=window.devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;
  c.width=w*dpr;c.height=h*dpr;const g=c.getContext('2d');g.scale(dpr,dpr);g.clearRect(0,0,w,h);
  const cs=getComputedStyle(document.documentElement);
  g.strokeStyle=cs.getPropertyValue('--line');g.beginPath();g.moveTo(0,h/2);g.lineTo(w,h/2);g.stroke();
  if(!take)return;
  const n=take.l.length,step=n/w;g.fillStyle=cs.getPropertyValue('--acc2').trim();
  for(let x=0;x<w;x++){
    let mn=1,mx=-1;const a=Math.floor(x*step),b=Math.min(n,Math.floor((x+1)*step)+1),k=Math.max(1,Math.floor((b-a)/64));
    for(let i=a;i<b;i+=k){const v=(take.l[i]+take.r[i])/2;if(v<mn)mn=v;if(v>mx)mx=v}
    if(mn>mx){mn=mx=0}
    const y1=h/2-mx*h/2*.95,y2=h/2-mn*h/2*.95;g.fillRect(x,y1,1,Math.max(1,y2-y1));
  }
}
function setTake(t){
  el.player.pause();if(takeUrl)URL.revokeObjectURL(takeUrl);
  take=t;takeUrl=URL.createObjectURL(wavBlob(t));el.player.src=takeUrl;
  el.time.textContent=fmtT(t.l.length/t.sr);drawWave();ui();
}
function clearTake(silent){
  el.player.pause();el.player.removeAttribute('src');
  if(takeUrl)URL.revokeObjectURL(takeUrl);takeUrl=null;take=null;orig=null;
  el.time.textContent='0:00.0';el.ph.style.display='none';drawWave();ui();if(!silent)say('Take deleted.');
}
const movePh=()=>{if(!take||!isFinite(el.player.duration))return;el.ph.style.display='block';el.ph.style.left=(el.player.currentTime/el.player.duration*100)+'%'};
const phLoop=()=>{movePh();if(!el.player.paused)phRaf=requestAnimationFrame(phLoop)};
el.player.addEventListener('play',()=>{cancelAnimationFrame(phRaf);phLoop()});
['pause','ended','seeked','timeupdate'].forEach(ev=>el.player.addEventListener(ev,movePh));
['play','pause','ended'].forEach(ev=>el.player.addEventListener(ev,ui));
el.wave.onclick=e=>{if(!take||!isFinite(el.player.duration))return;const r=el.wave.getBoundingClientRect();el.player.currentTime=(e.clientX-r.left)/r.width*el.player.duration;movePh()};

async function startRec(){
  if(take&&!confirm('Recording again will replace the current take. Continue?'))return;
  try{
    stream=await navigator.mediaDevices.getUserMedia({audio:{deviceId:gDev.value?{exact:gDev.value}:undefined,channelCount:{ideal:2},echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
  }catch(e){say('Cannot access microphone: '+(e.message||e.name),true);return}
  clearTake(true);await listDevices();
  ctx=new (window.AudioContext||window.webkitAudioContext)();sampleRate=ctx.sampleRate;
  const src=ctx.createMediaStreamSource(stream);
  analyser=ctx.createAnalyser();analyser.fftSize=1024;
  proc=ctx.createScriptProcessor(4096,2,2);
  const mute=ctx.createGain();mute.gain.value=0;
  src.connect(analyser);src.connect(proc);proc.connect(mute);mute.connect(ctx.destination);
  CL=[];CR=[];
  proc.onaudioprocess=e=>{if(!recording)return;CL.push(new Float32Array(e.inputBuffer.getChannelData(0)));CR.push(new Float32Array(e.inputBuffer.getChannelData(1)))};
  recording=true;t0=performance.now();ui();say('Recording… '+sampleRate/1000+' kHz, 16-bit stereo');
  const buf=new Float32Array(analyser.fftSize);
  (function tick(){
    if(!recording)return;
    analyser.getFloatTimeDomainData(buf);let pk=0;for(const v of buf)pk=Math.max(pk,Math.abs(v));
    el.lvl.style.width=Math.min(100,pk*100)+'%';
    el.time.textContent=fmtT((performance.now()-t0)/1000);
    raf=requestAnimationFrame(tick);
  })();
}
function stopRec(){
  if(!recording)return;
  recording=false;cancelAnimationFrame(raf);el.lvl.style.width='0';
  try{proc.disconnect();stream.getTracks().forEach(t=>t.stop());ctx.close()}catch(e){}
  const l=merge(CL),r=merge(CR);CL=[];CR=[];
  if(!l.length){say('Nothing was recorded.',true);ui();return}
  orig=null;setTake({l,r,sr:sampleRate});
  say('Take ready – '+fmtT(l.length/sampleRate)+'. Replay, process, save, or delete.');
}
el.rec.onclick=startRec;
el.stop.onclick=()=>{
  if(recording){stopRec();return}
  el.player.pause();el.player.currentTime=0;movePh();ui();say('Playback stopped.');
};
el.play.onclick=()=>{el.player.currentTime=0;el.player.play().catch(e=>say('Playback failed: '+e.message,true))};
function rstDel(){clearTimeout(delT);el.del.classList.remove('arm');el.del.textContent='🗑 Delete'}
el.del.onclick=()=>{
  if(!el.del.classList.contains('arm')){el.del.classList.add('arm');el.del.textContent='Confirm delete?';delT=setTimeout(rstDel,3000);return}
  rstDel();clearTake();
};

el.trim.onclick=async()=>{
  if(!take)return;
  const db=Math.min(-1,parseFloat(el.thr.value)||-40),th=Math.pow(10,db/20),{l,r,sr}=take,n=l.length;
  let a=0;while(a<n&&Math.abs(l[a])<=th&&Math.abs(r[a])<=th)a++;
  if(a===n){say('Whole clip is below '+db+' dB – lower the threshold.',true);return}
  let b=n-1;while(b>a&&Math.abs(l[b])<=th&&Math.abs(r[b])<=th)b--;
  const pad=Math.round(sr*.05),s=Math.max(0,a-pad),e=Math.min(n,b+pad+1);
  let nl=l.slice(s,e),nr=r.slice(s,e);const cut=(n-nl.length)/sr,target=-12;
  if(!orig)orig=take;
  say('Processing…');el.trim.disabled=true;
  let fxd='';
  try{const o=await applyFx(nl,nr,sr,getFx());nl=o.l;nr=o.r;fxd=o.desc}
  catch(err){say('Voice processing failed ('+err.message+') – applying trim and loudness only.',true)}
  const cur=lufs(nl,nr,sr);
  if(cur===null){setTake({l:nl,r:nr,sr});say('Trimmed '+cut.toFixed(2)+' s, but the clip is too short or quiet to measure loudness, so it was not normalised.',true);return}
  const gain=Math.pow(10,(target-cur)/20);
  for(let i=0;i<nl.length;i++){nl[i]*=gain;nr[i]*=gain}
  const limited=limiter(nl,nr,sr,Math.pow(10,-1/20)),fin=lufs(nl,nr,sr);
  setTake({l:nl,r:nr,sr});
  say('Trimmed '+cut.toFixed(2)+' s of silence'+fxd+'. Loudness '+cur.toFixed(1)+' → '+(fin===null?target:fin).toFixed(1)+' LUFS'+(limited?' (peaks limited to -1 dBFS, so the target was not fully reached)':'')+'.');
};
el.undo.onclick=()=>{if(!orig)return;const o=orig;orig=null;setTake(o);say('Processing undone.')};

el.save.onclick=async()=>{
  if(!take)return;
  const name=exportBase()+'.mp3';
  say('Encoding MP3…');el.save.disabled=true;
  await new Promise(r=>setTimeout(r,30));
  try{
    const blob=mp3Blob(take),url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),10000);
    say('Saved '+name+' ('+(blob.size/1048576).toFixed(2)+' MB)');
  }catch(e){say('Save failed: '+e.message,true)}
  ui();
};

/* ---- Clear all scripts ---- */
(function(){
  const b=document.getElementById('clearAll');let tm=0;
  const reset=()=>{clearTimeout(tm);b.dataset.arm='';b.style.background='';b.style.color='';b.style.borderColor='';b.textContent='✕ Clear all'};
  b.onclick=()=>{
    if(!b.dataset.arm){b.dataset.arm='1';b.style.background='var(--acc)';b.style.color='#fff';b.style.borderColor='var(--acc)';b.textContent='Are you sure? Click again';tm=setTimeout(reset,4000);return}
    reset();slots.filter(s=>s.clearable).forEach(s=>s.clearText());gsay('Cleared all four stories (intro and outro left as they are).');
  };
})();

/* ---- Export all scripts to one PDF ---- */
document.getElementById('pdfAll').onclick=()=>{
  if(!(window.jspdf&&window.jspdf.jsPDF)){gsay('PDF library failed to load (needs internet access).',true);return}
  const items=slots.map(s=>({n:s.label,head:false,text:s.text()})).filter(x=>x.text);
  if(!items.length){gsay('All script boxes are empty.',true);return}
  try{
    const doc=new window.jspdf.jsPDF({unit:'pt',format:'a4'}),W=doc.internal.pageSize.getWidth(),H=doc.internal.pageSize.getHeight(),M=56,maxW=W-2*M,docTitle=pdfBase();
    let y=M;
    doc.setFont('helvetica','bold');doc.setFontSize(24);
    doc.splitTextToSize(docTitle||'Care Radio briefing',maxW).forEach(l=>{doc.text(l,M,y+18);y+=32});
    doc.setFont('helvetica','normal');doc.setFontSize(10);doc.setTextColor(120);
    doc.text(exportBase()+'.mp3',M,y+4);y+=36;
    items.forEach((it,k)=>{
      if(k)y+=24;
      if(y+90>H-M){doc.addPage();y=M}
      if(it.head){doc.setFont('helvetica','bold');doc.setFontSize(16);doc.setTextColor(0);
      doc.text(it.n,M,y+14);y+=30}else doc.setTextColor(0);
      doc.setFont('helvetica','normal');doc.setFontSize(12);
      doc.splitTextToSize(it.text,maxW).forEach(l=>{if(y+18>H-M){doc.addPage();y=M}doc.text(l,M,y+12);y+=18});
    });
    const blob=doc.output('blob'),url=URL.createObjectURL(blob),a=document.createElement('a'),nm=(docTitle||'care-radio-briefing')+'.pdf';
    a.href=url;a.download=nm;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),10000);
    gsay('Exported '+items.length+' section'+(items.length===1?'':'s')+' to '+nm);
  }catch(e){gsay('PDF export failed: '+e.message,true)}
};

addEventListener('resize',drawWave);
const mq=matchMedia('(prefers-color-scheme:dark)');mq.addEventListener&&mq.addEventListener('change',drawWave);
drawWave();ui();
if(navigator.mediaDevices){navigator.mediaDevices.addEventListener&&navigator.mediaDevices.addEventListener('devicechange',listDevices);listDevices()}
else say('This browser does not support audio recording.',true);
